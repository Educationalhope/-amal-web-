<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة أمل التعليمية - إدارة الطلاب والحضور</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts: Cairo -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Cairo', sans-serif; }
</style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50/50 to-indigo-50/30 min-h-screen text-slate-800 pb-12">
<!-- Header / شريط العنوان -->
<header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-slate-100">
<div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-blue-500/20">
🌱
</div>
<div>
<h1 class="text-xl font-bold text-slate-800 leading-tight">تطبيق أمل التعليمي</h1>
<p class="text-xs text-slate-500">نظام إدارة الطلاب والحضور الذكي</p>
</div>
</div>
<div id="status-badge" class="text-xs bg-amber-50 text-amber-700 border border-amber-200/60 px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
جاري التحقق من قاعدة البيانات...
</div>
</div>
</header>
<main class="max-w-5xl mx-auto px-4 mt-8 grid grid-cols-1 md:grid-cols-3 gap-8">
<!-- قسم إضافة طالب جديد -->
<section class="md:col-span-1">
<div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 sticky top-24">
<h2 class="text-lg font-bold text-slate-800 mb-1 flex items-center gap-2">
<span>📝</span> تسجيل طالب جديد
</h2>
<p class="text-xs text-slate-500 mb-6">أدخل معلومات الطالب لإضافته لقاعدة البيانات.</p>
<form id="student-form" class="space-y-4">
<div>
<label class="block text-xs font-bold text-slate-600 mb-1.5">الاسم الثلاثي للطالب</label>
<input type="text" id="student-name" required placeholder="مثال: أحمد علي حسين"
class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition">
</div>
<div>
<label class="block text-xs font-bold text-slate-600 mb-1.5">الصف / المرحلة الدراسية</label>
<input type="text" id="student-grade" required placeholder="مثال: الثالث المتوسط"
class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition">
</div>
<div>
<label class="block text-xs font-bold text-slate-600 mb-1.5">رقم الهاتف (اختياري)</label>
<input type="tel" id="student-phone" placeholder="07XXXXXXXXX"
class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition">
</div>
<button type="submit" id="submit-btn"
class="w-full mt-2 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-3 rounded-xl transition duration-150 shadow-md shadow-blue-600/20 text-sm flex justify-center items-center gap-2">
<span>حفظ البيانات</span>
</button>
</form>
</div>
</section>
<!-- قسم السجلات ورصد الحضور -->
<section class="md:col-span-2 space-y-6">
<!-- شريط التنبيه في حال وجود أخطاء -->
<div id="alert-box" class="hidden p-4 rounded-xl border text-sm transition"></div>
<div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
<div class="flex flex-wrap justify-between items-center gap-4 mb-6">
<div>
<h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
<span>👥</span> قائمة الطلاب والحضور
</h2>
<p class="text-xs text-slate-500">سجل الطلاب المضافين في المعهد مع إمكانية تسجيل الحضور اليومي.</p>
</div>
<button id="refresh-btn" class="text-xs font-semibold text-blue-600 hover:text-blue-800 bg-blue-50 px-3 py-2 rounded-lg transition border border-blue-100">
🔄 تحديث القائمة
</button>
</div>
<!-- جدول أو قائمة الطلاب -->
<div id="students-container" class="space-y-3">
<div class="text-center py-12">
<div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
<p class="text-sm text-slate-500 mt-2">جاري تحميل سجلات الطلاب من فايربيس...</p>
</div>
</div>
</div>
</section>
</main>
<!-- Firebase SDK (Modular Version) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
// =========================================================
// ⚠️ يرجى استبدال الإعدادات التالية ببيانات مشروعك الخاصة من Firebase Console
// =========================================================
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_PROJECT_ID.appspot.com",
messagingSenderId: "YOUR_SENDER_ID",
appId: "YOUR_APP_ID"
};
// Initialize Firebase
let db;
const statusBadge = document.getElementById('status-badge');
const alertBox = document.getElementById('alert-box');
function showAlert(message, type = "error") {
alertBox.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-700', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
if (type === 'error') {
alertBox.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
} else {
alertBox.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
}
alertBox.innerHTML = message;
}
try {
const app = initializeApp(firebaseConfig);
db = getFirestore(app);
// تحقق بسيط من الربط
statusBadge.className = "text-xs bg-emerald-50 text-emerald-700 border border-emerald-200/60 px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5";
statusBadge.innerHTML = ⁠<span class="w-2 h-2 rounded-full bg-emerald-500"></span> متصل بـ Firebase⁠;
} catch (e) {
statusBadge.className = "text-xs bg-red-50 text-red-700 border border-red-200/60 px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5";
statusBadge.innerHTML = ⁠<span class="w-2 h-2 rounded-full bg-red-500"></span> خطأ في الاتصال⁠;
showAlert("<b>تنبيه:</b> يرجى التأكد من استبدال بيانات <code>firebaseConfig</code> ببيانات مشروعك الخاصة في ملف الـ HTML.");
}
// إضافة طالب جديد
const form = document.getElementById('student-form');
const submitBtn = document.getElementById('submit-btn');
form.addEventListener('submit', async (e) => {
e.preventDefault();
const name = document.getElementById('student-name').value.trim();
const grade = document.getElementById('student-grade').value.trim();
const phone = document.getElementById('student-phone').value.trim();
if (!name || !grade) return;
submitBtn.disabled = true;
submitBtn.innerText = "جاري الحفظ...";
try {
await addDoc(collection(db, "students"), {
name: name,
grade: grade,
phone: phone || "غير محدد",
attendanceStatus: "حاضر",
createdAt: serverTimestamp()
});
form.reset();
showAlert("✅ تم حفظ بيانات الطالب بنجاح!", "success");
loadStudents();
} catch (error) {
console.error("خطأ الحفظ: ", error);
if (error.code === 'permission-denied' || error.message.includes('permissions')) {
showAlert("❌ <b>خطأ الصلاحيات (Missing or insufficient permissions):</b>
يرجى التوجه إلى Firebase Console ثم Firestore Database > Rules وتعديل القواعد لتسمح بالكتابة والقراءة.");
} else {
showAlert("❌ حدث خطأ أثناء إضافة البيانات: " + error.message);
}
} finally {
submitBtn.disabled = false;
submitBtn.innerText = "حفظ البيانات";
}
});
// جلب قائمة الطلاب
async function loadStudents() {
const container = document.getElementById('students-container');
try {
const querySnapshot = await getDocs(collection(db, "students"));
if (querySnapshot.empty) {
container.innerHTML = ⁠<div class="text-center py-12 border-2 border-dashed border-slate-100 rounded-xl"> <p class="text-slate-400 text-sm">لا يوجد طلاب مسجلين في النظام حالياً.</p> <p class="text-xs text-slate-400 mt-1">استخدم النموذج المخصص لإضافة أول طالب.</p> </div>⁠;
return;
}
container.innerHTML = '';
querySnapshot.forEach((docSnap) => {
const student = docSnap.data();
const id = docSnap.id;
const isPresent = student.attendanceStatus === "حاضر";
const item = document.createElement('div');
item.className = "flex flex-wrap justify-between items-center p-4 bg-slate-50/80 hover:bg-slate-50 border border-slate-100 rounded-xl transition gap-3";
item.innerHTML = ⁠<div class="space-y-1"> <h3 class="font-bold text-slate-800 text-sm">${student.name}</h3> <div class="flex items-center gap-3 text-xs text-slate-500"> <span>📚 ${student.grade}</span> <span>📞 ${student.phone}</span> </div> </div> <div class="flex items-center gap-2"> <button onclick="toggleAttendance('${id}', '${student.attendanceStatus}')"  class="text-xs font-bold px-3 py-1.5 rounded-lg border transition ${ isPresent  ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100'  : 'bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100' }"> ${isPresent ? '✓ حاضر' : '✕ غائب'} </button> </div>⁠;
container.appendChild(item);
});
} catch (error) {
console.error("خطأ التحميل: ", error);
if (error.code === 'permission-denied' || error.message.includes('permissions')) {
showAlert("❌ <b>فشل تحميل البيانات بسبب قواعد الأمان (Missing or insufficient permissions):</b>
تأكد من تحديث القواعد في تبويب (Rules) بـ Firebase لتسمح بالقراءة <code>allow read, write: if true;</code>");
}
container.innerHTML = ⁠<p class="text-center text-sm text-red-500 py-6">فشل الاتصال بقاعدة البيانات.</p>⁠;
}
}
// إتاحة الدالة للتفاعل مع زر الحضور
window.toggleAttendance = async (docId, currentStatus) => {
const newStatus = currentStatus === "حاضر" ? "غائب" : "حاضر";
try {
const docRef = doc(db, "students", docId);
await updateDoc(docRef, { attendanceStatus: newStatus });
loadStudents();
} catch (err) {
alert("تعذر تغيير حالة الحضور: " + err.message);
}
};
document.getElementById('refresh-btn').addEventListener('click', loadStudents);
// تحميل البيانات أول مرة
loadStudents();
</script>
</body>
</html>
