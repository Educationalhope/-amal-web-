<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أمل التعليمية - إدارة المعاهد</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: #334155; margin: 0; padding: 15px; direction: rtl; }
        .container { max-width: 850px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none !important; }
        h1, h2, h3, h4 { color: #1e293b; margin-top: 0; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
        button { background-color: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; width: 100%; }
        button:hover { background-color: #1d4ed8; }
        .btn-sm { width: auto; padding: 5px 12px; font-size: 0.8rem; border-radius: 6px; }
        .btn-danger { background-color: #ef4444; } .btn-danger:hover { background-color: #dc2626; }
        .btn-warning { background-color: #f59e0b; color: white; } .btn-warning:hover { background-color: #d97706; }
        .btn-success { background-color: #16a34a; color: white; } .btn-success:hover { background-color: #15803d; }
        .btn-whatsapp { background-color: #25d366; color: white; } .btn-whatsapp:hover { background-color: #1ebe5d; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
        .badge-admin { background-color: #fef3c7; color: #92400e; }
        .badge-teacher { background-color: #e0e7ff; color: #3730a3; }
        .badge-present { background-color: #dcfce7; color: #166534; }
        .badge-absent { background-color: #fee2e2; color: #991b1b; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 15px; }
        .list-item { padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 12px; }
        .item-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
        .stats-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="login-section" class="card">
        <h1 style="text-align: center; font-size: 1.6rem;">🌱 منصة أمل التعليمية</h1>
        <p style="text-align: center; color: #64748b; font-size: 0.85rem; margin-bottom: 20px;">تسجيل الدخول للنظام</p>
        
        <form id="login-form">
            <div class="form-group">
                <label>اسم المستخدم (Username):</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم..." required>
            </div>
            <div class="form-group">
                <label>كلمة السر (Password):</label>
                <input type="password" id="password" placeholder="أدخل كلمة السر..." required>
            </div>
            <button type="submit">تسجيل الدخول</button>
        </form>
        <p id="login-error" style="color: #ef4444; text-align: center; font-size: 0.85rem; margin-top: 10px;" class="hidden">بيانات الدخول غير صحيحة!</p>
    </div>

    <!-- 2. لوحة التحكم الرئيسية -->
    <div id="dashboard-section" class="card hidden">
        <div class="header-bar">
            <div>
                <h2 id="user-display-name" style="margin: 0; display: inline-block; font-size: 1.2rem;">أهلاً بك</h2>
                <span id="role-badge" class="badge"></span>
            </div>
            <button type="button" class="btn-sm btn-danger" onclick="logout()">تسجيل خروج</button>
        </div>

        <!-- 📊 إحصائيات مالية سريعة -->
        <div class="stats-box">
            <div class="stat-card">
                <span style="font-size: 0.8rem; color: #64748b;">إجمالي القسائط</span>
                <h4 id="stat-total" style="margin: 5px 0 0; color: #2563eb;">0 د.ع</h4>
            </div>
            <div class="stat-card">
                <span style="font-size: 0.8rem; color: #64748b;">المبالغ الواصلة</span>
                <h4 id="stat-paid" style="margin: 5px 0 0; color: #16a34a;">0 د.ع</h4>
            </div>
            <div class="stat-card">
                <span style="font-size: 0.8rem; color: #64748b;">المتبقي ذمم</span>
                <h4 id="stat-remaining" style="margin: 5px 0 0; color: #dc2626;">0 د.ع</h4>
            </div>
        </div>

        <!-- 👑 لوحة المالك: إدارة المدرسين -->
        <div id="admin-only-section" class="hidden" style="background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <h3 style="color: #92400e; font-size: 1.1rem; margin-bottom: 10px;">👑 إعدادات المالك: إدارة المدرسين</h3>
            
            <div class="grid-3">
                <div class="form-group">
                    <label>اسم المدرس:</label>
                    <input type="text" id="new-teacher-name" placeholder="مثال: أستاذ علي">
                </div>
                <div class="form-group">
                    <label>اسم المستخدم:</label>
                    <input type="text" id="new-teacher-user" placeholder="ali2026">
                </div>
                <div class="form-group">
                    <label>كلمة السر:</label>
                    <input type="password" id="new-teacher-pass" placeholder="كلمة السر...">
                </div>
            </div>
            <button type="button" onclick="addNewTeacher()" style="background-color: #d97706; margin-top: 5px;">إضافة مدرس جديد</button>

            <h4 style="color: #92400e; margin-top: 15px; margin-bottom: 8px;">قائمة المدرسين:</h4>
            <div id="teachers-list"></div>
        </div>

        <!-- قسم إضافة الطلاب والأقساط -->
        <div class="card" style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 20px;">
            <h3 style="font-size: 1.05rem;">تسجيل طالب جديد مع الأقساط</h3>
            <div class="grid-4">
                <div class="form-group">
                    <label>اسم الطالب الثلاثي:</label>
                    <input type="text" id="student-name" placeholder="اسم الطالب...">
                </div>
                <div class="form-group">
                    <label>الصف / المرحلة:</label>
                    <input type="text" id="student-grade" placeholder="السادس العلمي">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="tel" id="student-phone" placeholder="07xxxxxxxx">
                </div>
                <div class="form-group">
                    <label>إجمالي القسط (د.ع):</label>
                    <input type="number" id="student-fee" placeholder="150000">
                </div>
            </div>
            <button type="button" onclick="addNewStudent()">حفظ وإضافة الطالب</button>
        </div>

        <!-- شريط البحث السريع وسجل الطلاب -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin: 0;">سجل الطلاب والمتابعة اليومية</h3>
            <input type="text" id="search-box" placeholder="🔍 ابحث عن اسم طالب..." onkeyup="renderStudentsList()" style="max-width: 250px; padding: 6px 12px; font-size: 0.85rem;">
        </div>
        <div id="students-list">
            <p style="color: #94a3b8; text-align: center;">لا يوجد طلاب مسجلين حالياً.</p>
        </div>
    </div>

</div>

<script>
    const DEFAULT_ADMIN = {
        "admin": { password: "123", name: "المالك", role: "admin" }
    };

    let currentUsername = null;
    let currentUser = null;

    // دالة لتنسيق الأرقام بوضع فاصلة الآلاف (مثال: 1,000)
    function formatMoney(amount) {
        return Number(amount || 0).toLocaleString('en-US');
    }

    function getUsers() {
        const saved = localStorage.getItem('amal_users');
        if (saved) return JSON.parse(saved);
        localStorage.setItem('amal_users', JSON.stringify(DEFAULT_ADMIN));
        return DEFAULT_ADMIN;
    }

    function getStudents() {
        const saved = localStorage.getItem('amal_students');
        const allStudents = saved ? JSON.parse(saved) : [];
        
        if (currentUser.role === 'admin') {
            return allStudents;
        } else {
            return allStudents.filter(s => s.addedByUsername === currentUsername);
        }
    }

    function getTodayDate() {
        const today = new Date();
        return today.toISOString().split('T')[0];
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const users = getUsers();

        if (users[u] && users[u].password === p) {
            currentUsername = u;
            currentUser = users[u];
            document.getElementById('login-error').classList.add('hidden');
            showDashboard();
        } else {
            document.getElementById('login-error').classList.remove('hidden');
        }
    });

    function showDashboard() {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');

        document.getElementById('user-display-name').textContent = currentUser.name;
        const roleBadge = document.getElementById('role-badge');

        if (currentUser.role === 'admin') {
            roleBadge.textContent = "المالك";
            roleBadge.className = "badge badge-admin";
            document.getElementById('admin-only-section').classList.remove('hidden');
            renderTeachersList();
        } else {
            roleBadge.textContent = "مدرس";
            roleBadge.className = "badge badge-teacher";
            document.getElementById('admin-only-section').classList.add('hidden');
        }

        renderStudentsList();
    }

    function addNewTeacher() {
        const name = document.getElementById('new-teacher-name').value.trim();
        const user = document.getElementById('new-teacher-user').value.trim();
        const pass = document.getElementById('new-teacher-pass').value.trim();

        if (!name || !user || !pass) {
            alert('الرجاء ملء جميع حقول المدرس!');
            return;
        }

        const users = getUsers();
        if (users[user]) {
            alert('اسم المستخدم هذا موجود بالفعل!');
            return;
        }

        users[user] = { password: pass, name: name, role: "teacher" };
        localStorage.setItem('amal_users', JSON.stringify(users));

        alert(`تمت إضافة المدرس (${name}) بنجاح!`);
        document.getElementById('new-teacher-name').value = '';
        document.getElementById('new-teacher-user').value = '';
        document.getElementById('new-teacher-pass').value = '';
        renderTeachersList();
    }

    function editTeacher(userKey) {
        const users = getUsers();
        const t = users[userKey];
        const newName = prompt("تعديل اسم المدرس:", t.name);
        const newPass = prompt("تعديل كلمة السر:", t.password);

        if (newName !== null && newPass !== null && newName.trim() !== "" && newPass.trim() !== "") {
            users[userKey].name = newName.trim();
            users[userKey].password = newPass.trim();
            localStorage.setItem('amal_users', JSON.stringify(users));
            alert("تم تعديل بيانات المدرس بنجاح!");
            renderTeachersList();
        }
    }

    function deleteTeacher(userKey) {
        if (confirm("هل أنت متأكد من حذف هذا المدرس؟")) {
            const users = getUsers();
            delete users[userKey];
            localStorage.setItem('amal_users', JSON.stringify(users));
            renderTeachersList();
        }
    }

    function renderTeachersList() {
        const list = document.getElementById('teachers-list');
        const users = getUsers();
        list.innerHTML = '';

        let hasTeachers = false;
        for (let u in users) {
            if (users[u].role === 'teacher') {
                hasTeachers = true;
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong>${users[u].name}</strong><br>
                            <small style="color: #64748b;">اليوزر: ${u} | الرمز: ${users[u].password}</small>
                        </div>
                        <div>
                            <button type="button" class="btn-sm btn-warning" onclick="editTeacher('${u}')">تعديل</button>
                            <button type="button" class="btn-sm btn-danger" onclick="deleteTeacher('${u}')">حذف</button>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            }
        }

        if (!hasTeachers) {
            list.innerHTML = '<p style="font-size:0.85rem; color:#78350f;">لا يوجد مدرسون مضافون بعد.</p>';
        }
    }

    function addNewStudent() {
        const name = document.getElementById('student-name').value.trim();
        const grade = document.getElementById('student-grade').value.trim();
        const phone = document.getElementById('student-phone').value.trim();
        const feeTotal = parseFloat(document.getElementById('student-fee').value) || 0;

        if (!name || !grade || !phone) {
            alert('الرجاء ملء الحقول الأساسية للطالب (الاسم، الصف، الهاتف)!');
            return;
        }

        const saved = localStorage.getItem('amal_students');
        const students = saved ? JSON.parse(saved) : [];

        students.push({
            id: Date.now(),
            name: name,
            grade: grade,
            phone: phone,
            totalFee: feeTotal,
            paidFee: 0,
            addedByUsername: currentUsername,
            addedByName: currentUser.name,
            attendance: {}
        });

        localStorage.setItem('amal_students', JSON.stringify(students));
        alert(`تمت إضافة الطالب (${name}) بنجاح!`);
        
        document.getElementById('student-name').value = '';
        document.getElementById('student-grade').value = '';
        document.getElementById('student-phone').value = '';
        document.getElementById('student-fee').value = '';
        renderStudentsList();
    }

    function updateFee(studentId) {
        const addAmount = prompt("أدخل المبلغ المراد تسديده من القسط (د.ع):");
        if (addAmount !== null && !isNaN(addAmount) && addAmount.trim() !== "") {
            const amount = parseFloat(addAmount);
            const saved = localStorage.getItem('amal_students');
            let allStudents = saved ? JSON.parse(saved) : [];
            const student = allStudents.find(s => s.id === studentId);
            
            if (student) {
                student.paidFee = (student.paidFee || 0) + amount;
                localStorage.setItem('amal_students', JSON.stringify(allStudents));
                alert("تم تسديد المبلغ بنجاح!");
                renderStudentsList();
            }
        }
    }

    // زر تعديل بيانات الطالب الأساسية
    function editStudent(studentId) {
        const saved = localStorage.getItem('amal_students');
        let allStudents = saved ? JSON.parse(saved) : [];
        const s = allStudents.find(st => st.id === studentId);

        if (s) {
            const newName = prompt("تعديل اسم الطالب:", s.name);
            const newGrade = prompt("تعديل الصف الدراسي:", s.grade);
            const newPhone = prompt("تعديل رقم الهاتف:", s.phone);
            const newFee = prompt("تعديل إجمالي القسط الكلي:", s.totalFee);

            if (newName !== null && newGrade !== null && newPhone !== null && newFee !== null) {
                s.name = newName.trim();
                s.grade = newGrade.trim();
                s.phone = newPhone.trim();
                s.totalFee = parseFloat(newFee) || 0;

                localStorage.setItem('amal_students', JSON.stringify(allStudents));
                alert("تم تعديل بيانات الطالب بنجاح!");
                renderStudentsList();
            }
        }
    }

    function printReceipt(studentId) {
        const saved = localStorage.getItem('amal_students');
        const allStudents = saved ? JSON.parse(saved) : [];
        const s = allStudents.find(st => st.id === studentId);

        if (s) {
            const receiptId = 'REC-' + s.id.toString().slice(-6);
            const todayDate = new Date().toLocaleDateString('ar-IQ');
            const total = s.totalFee || 0;
            const paid = s.paidFee || 0;
            const remaining = total - paid;

            const printWindow = window.open('', '', 'width=600,height=600');
            printWindow.document.write(`
                <html dir="rtl" lang="ar">
                <head>
                    <title>وصل قبض - ${s.name}</title>
                    <style>
                        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; direction: rtl; text-align: right; }
                        .receipt-box { border: 2px solid #333; padding: 20px; border-radius: 10px; }
                        .header { text-align: center; border-bottom: 2px dashed #333; padding-bottom: 10px; margin-bottom: 15px; }
                        .line { margin: 10px 0; font-size: 1.1rem; }
                        .footer { margin-top: 40px; display: flex; justify-content: space-between; text-align: center; }
                    </style>
                </head>
                <body>
                    <div class="receipt-box">
                        <div class="header">
                            <h2>🌱 منصة أمل التعليمية</h2>
                            <p>وصل قبض مالـي رسمي</p>
                        </div>
                        <div class="line"><strong>رقم الوصل:</strong> ${receiptId}</div>
                        <div class="line"><strong>التاريخ:</strong> ${todayDate}</div>
                        <div class="line"><strong>اسم الطالب:</strong> ${s.name}</div>
                        <div class="line"><strong>الصف / المرحلة:</strong> ${s.grade}</div>
                        <hr>
                        <div class="line"><strong>المبلغ الكلي للقسط:</strong> ${formatMoney(total)} د.ع</div>
                        <div class="line"><strong>المبلغ المدفوع حالياً:</strong> ${formatMoney(paid)} د.ع</div>
                        <div class="line"><strong>المتبقي ذمته:</strong> ${formatMoney(remaining)} د.ع</div>
                        <div class="footer">
                            <div>توقيع الإدارة<br><br>...................</div>
                            <div>توقيع المحاسب<br><br>...................</div>
                        </div>
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => {
                printWindow.print();
                printWindow.close();
            }, 300);
        }
    }

    function sendWhatsApp(phone, studentName, status, date, remainingFee) {
        let cleanPhone = phone.replace(/\D/g, '');
        if (cleanPhone.startsWith('0')) {
            cleanPhone = '964' + cleanPhone.substring(1);
        }

        let message = `إدارة منصة أمل التعليمية\nولي الأمر المحترم، نود إعلامكم بأن ابنكم/تكم (${studentName}) سجل بحالة الحضور ليوم ${date} كـ: *${status}*.\nالمبلغ المتبقي من القسط: ${formatMoney(remainingFee)} د.ع.\nمع الشكر والتقدير.`;
        
        const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }

    function setStudentStatus(studentId, dateInputId, status) {
        const dateVal = document.getElementById(dateInputId).value;
        if (!dateVal) {
            alert('الرجاء تحديد التاريخ أولاً!');
            return;
        }

        const saved = localStorage.getItem('amal_students');
        const allStudents = saved ? JSON.parse(saved) : [];
        const student = allStudents.find(s => s.id === studentId);
        
        if (student) {
            if (!student.attendance) student.attendance = {};
            student.attendance[dateVal] = status;
            localStorage.setItem('amal_students', JSON.stringify(allStudents));
            renderStudentsList();
        }
    }

    function deleteStudent(studentId) {
        if (confirm("هل أنت متأكد من حذف هذا الطالب؟")) {
            const saved = localStorage.getItem('amal_students');
            let allStudents = saved ? JSON.parse(saved) : [];
            allStudents = allStudents.filter(s => s.id !== studentId);
            localStorage.setItem('amal_students', JSON.stringify(allStudents));
            renderStudentsList();
        }
    }

    function renderStudentsList() {
        const list = document.getElementById('students-list');
        let students = getStudents();
        
        // تطبيق البحث السريع
        const searchQuery = document.getElementById('search-box').value.trim().toLowerCase();
        if (searchQuery) {
            students = students.filter(s => s.name.toLowerCase().includes(searchQuery) || s.phone.includes(searchQuery));
        }

        list.innerHTML = '';

        // حساب وإظهار إحصائيات المعهد المالية
        let totalSum = 0;
        let paidSum = 0;
        getStudents().forEach(s => {
            totalSum += (s.totalFee || 0);
            paidSum += (s.paidFee || 0);
        });
        document.getElementById('stat-total').textContent = formatMoney(totalSum) + ' د.ع';
        document.getElementById('stat-paid').textContent = formatMoney(paidSum) + ' د.ع';
        document.getElementById('stat-remaining').textContent = formatMoney(totalSum - paidSum) + ' د.ع';

        if (students.length === 0) {
            list.innerHTML = '<p style="color: #94a3b8; text-align: center;">لا يوجد طلاب مسجلين حالياً.</p>';
            return;
        }

        const today = getTodayDate();

        students.forEach((s) => {
            const activeDateInputId = `date-${s.id}`;
            const item = document.createElement('div');
            item.className = 'list-item';
            
            let selectedDate = today;
            const existingInput = document.getElementById(activeDateInputId);
            if (existingInput && existingInput.value) {
                selectedDate = existingInput.value;
            }

            const total = s.totalFee || 0;
            const paid = s.paidFee || 0;
            const remaining = total - paid;

            let currentStatus = (s.attendance && s.attendance[selectedDate]) ? s.attendance[selectedDate] : 'غير مسجل';

            item.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom: 1px dashed #cbd5e1; padding-bottom: 8px; margin-bottom: 8px;">
                    <div>
                        <strong style="font-size:1.1rem; color:#0f172a;">${s.name}</strong> - <span style="color: #2563eb;">${s.grade}</span><br>
                        <small style="color: #64748b;">📱 الهاتف: ${s.phone} ${currentUser.role === 'admin' ? `| أُضيف بواسطة: ${s.addedByName}` : ''}</small>
                    </div>
                    <div style="text-align: left; font-size: 0.85rem; background: #f1f5f9; padding: 6px; border-radius: 6px;">
                        <span>القسط الكلي: <strong>${formatMoney(total)}</strong> د.ع</span><br>
                        <span>الواصل: <strong style="color: #16a34a;">${formatMoney(paid)}</strong> د.ع</span><br>
                        <span>المتبقي: <strong style="color: #dc2626;">${formatMoney(remaining)}</strong> د.ع</span>
                    </div>
                </div>

                <div class="item-actions">
                    <label style="margin:0; font-size:0.8rem;">التاريخ:</label>
                    <input type="date" id="${activeDateInputId}" value="${selectedDate}" style="width: auto; padding: 3px 6px; font-size: 0.8rem;">
                    
                    <button type="button" class="btn-sm btn-success" onclick="setStudentStatus(${s.id}, '${activeDateInputId}', 'حاضر')">حاضر</button>
                    <button type="button" class="btn-sm btn-danger" onclick="setStudentStatus(${s.id}, '${activeDateInputId}', 'غائب')">غائب</button>
                    
                    <span style="font-size: 0.85rem; font-weight: bold;" id="status-view-${s.id}">
                        ${getAttendanceLabel(s, selectedDate)}
                    </span>
                </div>

                <div class="item-actions" style="margin-top: 8px; border-top: 1px solid #e2e8f0; padding-top: 8px;">
                    <button type="button" class="btn-sm btn-warning" onclick="updateFee(${s.id})">💰 تسديد قسط</button>
                    <button type="button" class="btn-sm" style="background:#0284c7;" onclick="printReceipt(${s.id})">🖨️ طباعة وصل</button>
                    <button type="button" class="btn-sm btn-whatsapp" onclick="sendWhatsApp('${s.phone}', '${s.name}', '${currentStatus}', '${selectedDate}', ${remaining})">💬 إرسال واتساب</button>
                    <button type="button" class="btn-sm" style="background:#64748b;" onclick="editStudent(${s.id})">✏️ تعديل</button>
                    <button type="button" class="btn-sm btn-danger" style="margin-right: auto;" onclick="deleteStudent(${s.id})">حذف</button>
                </div>
            `;
            list.appendChild(item);

            setTimeout(() => {
                const dateInputElem = document.getElementById(activeDateInputId);
                if (dateInputElem) {
                    dateInputElem.addEventListener('change', function() {
                        const viewElem = document.getElementById(`status-view-${s.id}`);
                        if (viewElem) {
                            viewElem.innerHTML = getAttendanceLabel(s, this.value);
                        }
                    });
                }
            }, 0);
        });
    }

    function getAttendanceLabel(student, targetDate) {
        if (student.attendance && student.attendance[targetDate]) {
            const st = student.attendance[targetDate];
            if (st === 'حاضر') return `<span class="badge badge-present">حاضر (${targetDate})</span>`;
            if (st === 'غائب') return `<span class="badge badge-absent">غائب (${targetDate})</span>`;
        }
        return '<span class="badge" style="background:#e2e8f0; color:#475569;">لم يُسجل</span>';
    }

    function logout() {
        currentUsername = null;
        currentUser = null;
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('login-section').classList.remove('hidden');
    }
</script>

</body>
</html>
