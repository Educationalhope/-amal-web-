<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أمل التعليمية - إدارة المعاهد</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: #334155; margin: 0; padding: 15px; direction: rtl; }
        .container { max-width: 750px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none !important; }
        h1, h2, h3 { color: #1e293b; margin-top: 0; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
        button { background-color: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; width: 100%; }
        button:hover { background-color: #1d4ed8; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
        .badge-admin { background-color: #fef3c7; color: #92400e; }
        .badge-teacher { background-color: #e0e7ff; color: #3730a3; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 15px; }
        .logout-btn { background-color: #ef4444; width: auto; padding: 6px 14px; font-size: 0.85rem; }
        .logout-btn:hover { background-color: #dc2626; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="login-section" class="card">
        <h1 style="text-align: center; font-size: 1.6rem;">🌱 منصة أمل - تسجيل الدخول</h1>
        <p style="text-align: center; color: #64748b; font-size: 0.85rem; margin-bottom: 20px;">أدخل اسم المستخدم وكلمة السر الخاصة بك</p>
        
        <form id="login-form">
            <div class="form-group">
                <label>اسم المستخدم (Username):</label>
                <input type="text" id="username" placeholder="مثال: admin أو اسم المدرس" required>
            </div>
            <div class="form-group">
                <label>كلمة السر (Password):</label>
                <input type="password" id="password" placeholder="أدخل كلمة السر..." required>
            </div>
            <button type="submit">تسجيل الدخول</button>
        </form>
        <p id="login-error" style="color: #ef4444; text-align: center; font-size: 0.85rem; margin-top: 10px;" class="hidden">بيانات الدخول غير صحيحة!</p>
    </div>

    <!-- 2. لوحة التحكم الرئيسية -->
    <div id="dashboard-section" class="card hidden">
        <div class="header-bar">
            <div>
                <h2 id="user-display-name" style="margin: 0; display: inline-block; font-size: 1.2rem;">أهلاً بك</h2>
                <span id="role-badge" class="badge"></span>
            </div>
            <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
        </div>

        <!-- 👑 قسم خاص بالمالك فقط: إضافة المدرسين -->
        <div id="admin-only-section" class="hidden" style="background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <h3 style="color: #92400e; font-size: 1.1rem; margin-bottom: 10px;">👑 لوحة المالك: إضافة مدرس جديد</h3>
            <form id="add-teacher-form">
                <div class="grid-2">
                    <div class="form-group">
                        <label>اسم المدرس (العرض):</label>
                        <input type="text" id="new-teacher-name" placeholder="مثال: أستاذ علي" required>
                    </div>
                    <div class="form-group">
                        <label>اسم المستخدم (اليوزر):</label>
                        <input type="text" id="new-teacher-user" placeholder="مثال: ali2026" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>كلمة السر:</label>
                    <input type="password" id="new-teacher-pass" placeholder="أدخل كلمة سر للمدرس..." required>
                </div>
                <button type="submit" style="background-color: #d97706;">إضافة المدرس للقاعدة</button>
            </form>

            <h4 style="color: #92400e; margin-top: 15px; margin-bottom: 8px;">قائمة المدرسين المسجلين:</h4>
            <div id="teachers-list"></div>
        </div>

        <!-- قسم إضافة الطلاب (متاح للمالك وللمدرسين) -->
        <div class="card" style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 20px;">
            <h3 style="font-size: 1.05rem;">تسجيل طالب جديد</h3>
            <form id="student-form">
                <div class="grid-2">
                    <div class="form-group">
                        <label>اسم الطالب الثلاثي:</label>
                        <input type="text" id="student-name" required placeholder="اسم الطالب...">
                    </div>
                    <div class="form-group">
                        <label>الصف / المرحلة:</label>
                        <input type="text" id="student-grade" required placeholder="مثال: السادس العلمي">
                    </div>
                </div>
                <button type="submit">إضافة الطالب</button>
            </form>
        </div>

        <!-- قائمة الطلاب -->
        <h3>قائمة الطلاب المسجلين</h3>
        <div id="students-list">
            <p style="color: #94a3b8; text-align: center;">لا يوجد طلاب مسجلين حالياً.</p>
        </div>
    </div>

</div>

<script>
    // حساب المالك الافتراضي
    const DEFAULT_ADMIN = {
        "admin": { password: "123", name: "المالك (مؤمل)", role: "admin" }
    };

    // تحميل الحسابات من الذاكرة أو استرجاع الافتراضي
    function getUsers() {
        const saved = localStorage.getItem('amal_users');
        if (saved) {
            return JSON.parse(saved);
        }
        localStorage.setItem('amal_users', JSON.stringify(DEFAULT_ADMIN));
        return DEFAULT_ADMIN;
    }

    let currentUser = null;

    // تسجيل الدخول
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const users = getUsers();

        if (users[u] && users[u].password === p) {
            currentUser = users[u];
            document.getElementById('login-error').classList.add('hidden');
            showDashboard();
        } else {
            document.getElementById('login-error').classList.remove('hidden');
        }
    });

    // عرض لوحة التحكم وتحديث الواجهة حسب الصلاحية
    function showDashboard() {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');

        document.getElementById('user-display-name').textContent = currentUser.name;
        const roleBadge = document.getElementById('role-badge');

        if (currentUser.role === 'admin') {
            roleBadge.textContent = "المالك (Admin)";
            roleBadge.className = "badge badge-admin";
            document.getElementById('admin-only-section').classList.remove('hidden');
            renderTeachersList();
        } else {
            roleBadge.textContent = "مدرس (Teacher)";
            roleBadge.className = "badge badge-teacher";
            document.getElementById('admin-only-section').classList.add('hidden');
        }
    }

    // إضافة مدرس جديد (خاص بالمالك)
    document.getElementById('add-teacher-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('new-teacher-name').value.trim();
        const user = document.getElementById('new-teacher-user').value.trim();
        const pass = document.getElementById('new-teacher-pass').value.trim();

        const users = getUsers();
        if (users[user]) {
            alert('اسم المستخدم هذا موجود بالفعل، اختر اسماً آخر!');
            return;
        }

        users[user] = { password: pass, name: name, role: "teacher" };
        localStorage.setItem('amal_users', JSON.stringify(users));

        alert(`تمت إضافة المدرس (${name}) بنجاح!`);
        this.reset();
        renderTeachersList();
    });

    // عرض قائمة المدرسين لـ المالك
    function renderTeachersList() {
        const list = document.getElementById('teachers-list');
        const users = getUsers();
        list.innerHTML = '';

        let hasTeachers = false;
        for (let u in users) {
            if (users[u].role === 'teacher') {
                hasTeachers = true;
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div>
                        <strong>${users[u].name}</strong><br>
                        <small style="color: #64748b;">اليوزر: ${u} | الرمز: ${users[u].password}</small>
                    </div>
                    <span class="badge badge-teacher">مدرس</span>
                `;
                list.appendChild(item);
            }
        }

        if (!hasTeachers) {
            list.innerHTML = '<p style="font-size:0.85rem; color:#78350f;">لا يوجد مدرسون مضافون بعد.</p>';
        }
    }

    // تسجيل الخروج
    function logout() {
        currentUser = null;
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('login-section').classList.remove('hidden');
    }
</script>

</body>
</html>
